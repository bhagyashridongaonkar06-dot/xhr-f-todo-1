<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xhr with firebase and todo 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <h2 class="bg-warning text-white text-center p-2">Xhr with firebase and todo 1</h2>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form action="" id="todoForm">
                            <div class="form-group">
                                <label for="todo">Enter Todo<span class="text-danger">*</span></label>
                                <input type="text" id="todo" class="form-control">
                            </div>

                            <button type="submit" class="btn-primary btn-block btn-sm" id="addTodo">Add Todo</button>
                            <button type="button" class="btn-warning btn-block btn-sm d-none" id="updateTodo">Update
                                Todo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <ul class="list-group" id="todoContainer">
                            <!-- <li class="list-group-items d-flex justify-content-between align-items-center">
                                <b>JAVA</b>

                                <div>
                                    <button class="btn-sm btn-warning"><i
                                            class="fa-solid fa-pen-to-square fa-2x text-white"></i></button>
                                    <button class="btn-sm btn-danger"><i class="fa-solid fa-trash fa-2x"></i></button>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
